<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- iPhone: als App vom Home-Bildschirm im Vollbild starten -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Abfahrt">
<title>Abfahrten Baumschulenweg</title>
<style>
  /* Bewusst nur Schwarz/Weiß/Grau – so lässt es sich später 1:1 aufs E-Ink-Display bringen. */
  :root { --bvg-yellow: #F0D722; --ink: #000; --paper: #fff; --muted: #666; --line: #000; --rule: #ccc; }
  /* Darkmode: folgt dem System, außer man hat per Knopf etwas anderes gewählt */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #f2f2f2; --paper: #111; --muted: #999; --line: #f2f2f2; --rule: #333; }
  }
  :root[data-theme="dark"] { --ink: #f2f2f2; --paper: #111; --muted: #999; --line: #f2f2f2; --rule: #333; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: flex; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .board { width: 100%; max-width: 800px; }
  /* Kopfzeile: links Laufschrift (nimmt den Rest, ca. die Hälfte), dann Klappuhr, rechts Datum */
  header {
    display: grid; grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center; gap: 14px;
    border-bottom: 4px solid var(--line); padding-bottom: 6px; margin-bottom: 12px;
  }
  /* LED-Matrix wie die alten S-Bahn-Zugzielanzeiger – bewusst in beiden Modi dunkel */
  #led {
    width: 100%; height: 52px; display: block;
    background: #0d0a06; border-radius: 6px; border: 3px solid #2b2b2b;
  }

  /* Klappuhr (Flip-Clock) – Karten bleiben in beiden Modi dunkel, wie das echte Gerät */
  .flipclock { display: flex; align-items: center; justify-content: center; gap: 4px; }
  /* Sekunden etwas kleiner, unten bündig – wie bei echten Klappuhren */
  .flipclock .sec { align-self: flex-end; }
  .flip.small { --h: 38px; width: 24px; font-size: 28px; }
  .date { margin-left: 6px; text-align: right; line-height: 1.15; white-space: nowrap; }
  .date .wd { font-size: 22px; font-weight: 800; }
  .date .dm { font-size: 17px; color: var(--muted); }
  .flip-group { display: flex; gap: 3px; }
  .flip-colon { font-size: 30px; font-weight: 800; color: var(--ink); margin: 0 1px; line-height: 1; }
  .flip {
    --h: 52px; position: relative; width: 32px; height: var(--h);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; font-size: 40px;
    perspective: 220px; color: #f4f1ea; border-radius: 5px;
    box-shadow: 0 2px 3px rgba(0,0,0,.35);
  }
  .flip > div {
    position: absolute; left: 0; right: 0; height: 50%; overflow: hidden;
    backface-visibility: hidden;
  }
  .flip span { display: block; height: var(--h); line-height: var(--h); text-align: center; }
  .flip .top, .flip .flap-top { top: 0; border-radius: 5px 5px 0 0; background: #2c2c2c; transform-origin: bottom; }
  .flip .bottom, .flip .flap-bottom { bottom: 0; border-radius: 0 0 5px 5px; background: #242424; transform-origin: top; }
  .flip .bottom span, .flip .flap-bottom span { margin-top: calc(var(--h) / -2); }
  /* Trennfuge in der Mitte */
  .flip::after {
    content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px;
    background: #0b0b0b; z-index: 4;
  }
  .flip .flap-top, .flip .flap-bottom { display: none; z-index: 3; }
  .flip.flipping .flap-top { display: block; animation: flap-top .09s ease-in forwards; }
  .flip.flipping .flap-bottom { display: block; transform: rotateX(90deg); animation: flap-bottom .09s ease-out .09s forwards; }
  @keyframes flap-top { to { transform: rotateX(-90deg); } }
  @keyframes flap-bottom { to { transform: rotateX(0deg); } }

  .bottom-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .bottom-bar footer { flex: 1; align-items: center; }

  /* API-Status als S-Bahn-Türknopf: LED-Kranz blinkt grün (ok) oder rot (keine Antwort) */
  .door-btn { --led: #6a6a6a; flex: none; width: 34px; height: 34px; display: block; }
  .door-btn.ok { --led: #33E05C; }
  .door-btn.err { --led: #FF2A1F; }
  .door-btn .leds line {
    stroke: var(--led); filter: drop-shadow(0 0 2px var(--led));
    animation: door-blink 1.2s steps(1) infinite;
  }
  .door-btn.loading .leds line { animation: none; filter: none; }
  @keyframes door-blink { 50% { stroke: #2e2e2e; filter: none; } }
  @media (prefers-reduced-motion: reduce) { .door-btn .leds line { animation: none; } }
  @media (max-width: 640px) {
    header { grid-template-columns: auto 1fr; }
  }
  @media (max-width: 480px) {
    .flip { --h: 44px; width: 27px; font-size: 34px; }
    .flip.small { --h: 32px; width: 20px; font-size: 23px; }
    .date .wd { font-size: 18px; }
    .date .dm { font-size: 14px; }
  }
  @media (max-width: 640px) {
    #led { grid-column: 1 / -1; }
    .flipclock { justify-content: flex-start; }
  }
  /* Hell/Dunkel als Kippschalter: Hebel kippt zur Sonne oder zum Mond */
  #theme-toggle { background: none; border: 0; padding: 0; cursor: pointer; display: block; }
  #theme-toggle svg { display: block; width: 82px; height: 46px; }
  #theme-toggle .lever { transition: transform .22s cubic-bezier(.5, 1.6, .5, 1); transform-origin: 36px 28px; transform: rotate(-38deg); }
  #theme-toggle[data-mode="dark"] .lever { transform: rotate(38deg); }
  #theme-toggle .sun, #theme-toggle .moon { transition: opacity .2s; opacity: .3; }
  #theme-toggle[data-mode="light"] .sun, #theme-toggle[data-mode="dark"] .moon { opacity: 1; }
  #theme-toggle:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; border-radius: 6px; }

  section { margin-bottom: 18px; }
  .sec-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 14px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700;
    border-bottom: 2px solid var(--line); padding-bottom: 3px; margin-bottom: 2px;
  }
  .sec-head .title { display: flex; align-items: center; gap: 8px; }
  .sec-head .icon { width: 22px; height: 22px; flex: none; display: block; }
  .sec-head { gap: 10px; }
  .sec-head .title { flex: 1; min-width: 0; }
  .sec-head .walk { white-space: nowrap; }
  .sec-head .walk { font-weight: 400; text-transform: none; letter-spacing: 0; }

  .row {
    display: grid; grid-template-columns: 64px 1fr auto 96px;
    align-items: center; gap: 12px; padding: 7px 4px;
    border-bottom: 1px solid var(--rule);
  }
  .badge {
    font-weight: 800; font-size: 18px; text-align: center; padding: 3px 0;
    border: 2px solid var(--ink); border-radius: 4px;
  }
  .badge.s {
    border-radius: 14px; color: #fff;
    background: var(--line-color, var(--ink)); border-color: var(--line-color, var(--ink));
  }
  .dest { font-size: 19px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dest small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
  .leave { font-size: 14px; text-align: right; white-space: nowrap; }
  .leave b { font-size: 17px; }
  .mins { font-size: 30px; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
  .mins span { font-size: 15px; font-weight: 600; }

  /* Busnummern im BVG-Gelb */
  .badge.bus { background: var(--bvg-yellow); color: #000; border-color: var(--bvg-yellow); }
  /* "JETZT LOS!" – rot hinterlegt und blinkend */
  .go-label {
    display: inline-block; background: #E30613; color: #fff; font-weight: 800; font-size: 16px;
    padding: 4px 9px; border-radius: 4px; animation: go-blink 1.6s steps(1) infinite;
  }
  @keyframes go-blink { 50% { background: transparent; color: #E30613; } }
  @media (prefers-reduced-motion: reduce) { .go-label { animation: none; } }
  /* Abgelaufene Zeile: Mini-S-Bahn bzw. Mini-Bus fährt von links nach rechts durch und räumt sie ab */
  .row { position: relative; overflow: hidden; }
  .wiper {
    position: absolute; left: 0; top: 0; bottom: 0; width: var(--veh-w); z-index: 2;
    display: flex; align-items: flex-end;
    transform: translateX(-100%); animation: drive var(--dur) cubic-bezier(.62, 0, .85, .55) forwards; /* langsam anfahren, dann beschleunigen */
  }
  .wiper::before { /* Abdeckung: alles hinter der Fahrzeugnase ist leer, die Nase selbst bleibt frei sichtbar */
    content: ''; position: absolute; left: -3000px; right: var(--nose); top: 0; bottom: 0; background: var(--paper);
  }
  .wiper svg { display: block; width: 100%; height: var(--veh-h); position: relative; z-index: 1; }
  @keyframes drive { to { transform: translateX(var(--row-w)); } }
  .row.collapsing { transition: max-height .35s ease, padding .35s ease, border-width .35s ease; max-height: 0 !important; padding-top: 0; padding-bottom: 0; border-bottom-width: 0; }
  .row.cancelled .dest, .row.cancelled .mins { text-decoration: line-through; color: var(--muted); }

  .empty { padding: 10px 4px; color: var(--muted); font-style: italic; }
  footer { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  footer.error { color: var(--ink); font-weight: 700; }

  /* Handy: "los in …" rechts unter die Minuten, damit die Zeilen flach bleiben */
  @media (max-width: 520px) {
    .row { grid-template-columns: 52px 1fr auto; column-gap: 10px; row-gap: 0; }
    .badge { grid-row: 1 / 3; }
    .dest { grid-row: 1 / 3; font-size: 17px; }
    .mins { grid-row: 1; grid-column: 3; font-size: 26px; line-height: 1.05; }
    .leave { grid-row: 2; grid-column: 3; font-size: 12px; }
    .leave b { font-size: 14px; }
    .go-label { font-size: 12px; padding: 2px 6px; }
  }
</style>
</head>
<body>
<div class="board">
  <header>
    <canvas id="led" aria-label="WER ZU SPÄT KOMMT MAHLT ZUERST"></canvas>
    <div class="flipclock" id="flipclock" aria-live="off">
      <div class="flip-group"><div class="flip" data-key="h1"></div><div class="flip" data-key="h2"></div></div>
      <div class="flip-colon">:</div>
      <div class="flip-group"><div class="flip" data-key="m1"></div><div class="flip" data-key="m2"></div></div>
      <div class="flip-group sec"><div class="flip small" data-key="s1"></div><div class="flip small" data-key="s2"></div></div>
    </div>
    <div class="date"><div class="wd" id="date-wd"></div><div class="dm" id="date-dm"></div></div>
  </header>
  <div id="sections"></div>
  <div class="bottom-bar">
    <svg class="door-btn loading" id="api-light" viewBox="0 0 100 100" role="img" aria-label="API-Status">
      <circle cx="50" cy="50" r="49" fill="#3DA57F"/>
      <circle cx="50" cy="50" r="40" fill="#1b1d1c"/>
      <g class="leds" stroke-width="3.4" stroke-linecap="round"></g>
      <circle cx="50" cy="50" r="23" fill="#3DA57F"/>
      <path d="M45 40 L36 50 L45 60 M55 40 L64 50 L55 60" fill="none" stroke="#1b1d1c" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <footer id="status">Lade…</footer>
    <button id="theme-toggle" type="button" title="Hell / Dunkel umschalten" aria-label="Hell / Dunkel umschalten">
      <svg viewBox="0 0 72 40" aria-hidden="true">
        <defs>
          <radialGradient id="tg-nut" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#f4f4f4"/><stop offset=".6" stop-color="#a9a9a9"/><stop offset="1" stop-color="#6d6d6d"/></radialGradient>
          <linearGradient id="tg-lever" x1="0" x2="1"><stop offset="0" stop-color="#8d8d8d"/><stop offset=".45" stop-color="#f7f7f7"/><stop offset="1" stop-color="#8a8a8a"/></linearGradient>
        </defs>
        <g class="sun" fill="#F5B700" stroke="#F5B700" stroke-width="1.6" stroke-linecap="round">
          <circle cx="9" cy="28" r="3.6" stroke="none"/>
          <path d="M9 21.5v2 M9 32.5v2 M2.5 28h2 M13.5 28h2 M4.4 23.4l1.4 1.4 M12.2 31.2l1.4 1.4 M4.4 32.6l1.4-1.4 M12.2 24.8l1.4-1.4"/>
        </g>
        <path class="moon" d="M66 23.5a5 5 0 1 0 2.8 8.6a4 4 0 1 1 -2.8 -8.6z" fill="#8FA2EE"/>
        <g transform="translate(36 28) scale(.78) translate(-36 -28)">
        <polygon points="36,19 43.8,23.5 43.8,32.5 36,37 28.2,32.5 28.2,23.5" fill="url(#tg-nut)" stroke="#555" stroke-width=".6"/>
        <circle cx="36" cy="28" r="5" fill="#bdbdbd" stroke="#666" stroke-width=".6"/>
        <g class="lever">
          <path d="M33.6 28 L34.4 7 h3.2 L38.4 28 z" fill="url(#tg-lever)" stroke="#666" stroke-width=".5"/>
          <rect x="33.4" y="3" width="5.2" height="7" rx="2.6" fill="url(#tg-lever)" stroke="#666" stroke-width=".5"/>
        </g>
        </g>
      </svg>
    </button>
  </div>
</div>

<script>
// ---------- Konfiguration ----------
const API = 'https://v6.vbb.transport.rest';
const REFRESH_MS = 5000;
const ROWS_PER_STOP = 5;
const DEMO = true; // Demo-Fahrplan anzeigen, solange die API keine Daten liefert

// lines: Linie -> Liste von Zielen (Teilstring reicht), die "stadteinwärts" bedeuten.
const STOPS = [
  {
    id: '900191001', label: 'S Baumschulenweg', icon: 'sbahn', walk: 7, suburban: true,
    lines: {
      S9:  ['Spandau', 'Warschauer'],
      S8:  ['Birkenwerder', 'Hohen Neuendorf', 'Pankow', 'Blankenburg', 'Ostkreuz', 'Treptower Park'],
      S85: ['Frohnau', 'Waidmannslust', 'Pankow'],
      S46: ['Westend', 'Tempelhof'],
    },
  },
  {
    id: '900191003', label: 'Baumschulenstr./Köpenicker Landstr.', icon: 'bus', walk: 5, suburban: false,
    lines: {
      '170': ['Rathaus Steglitz'],
      '165': ['Märkisches Museum'],
      '265': ['Märkisches Museum'],
    },
  },
];

// Offizielle Linienfarben der S-Bahn Berlin
const LINE_COLORS = {
  S1: '#DE4DA4', S2: '#005F27', S25: '#005F27', S26: '#005F27', S3: '#0A4C99',
  S41: '#AD5937', S42: '#CB6418', S45: '#CD9C53', S46: '#CD9C53', S47: '#CD9C53',
  S5: '#EB7405', S7: '#816DA6', S75: '#816DA6', S8: '#55A822', S85: '#55A822', S9: '#992746',
};

// Symbole für die Abschnittsüberschriften
const ICONS = {
  // S-Bahn: grüner Kreis mit weißem S
  sbahn: `<svg class="icon" viewBox="0 0 24 24" aria-label="S-Bahn"><circle cx="12" cy="12" r="12" fill="#008D4F"/>
    <text x="12" y="17.6" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="17" fill="#fff">S</text></svg>`,
  // Bus: das typische lila BUS-Schild
  bus: `<svg class="icon" viewBox="0 0 34 22" style="width:34px" aria-label="Bus"><rect width="34" height="22" rx="4" fill="#95276E"/>
    <text x="17" y="16" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="13" letter-spacing=".3" fill="#fff">BUS</text></svg>`,
};

// ---------- Logik ----------
const fmtTime = d => d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
const cleanName = s => s.replace(/\s*\((Berlin)\)/, '').replace(/\s+Bhf\b/, '');

async function loadStop(stop) {
  const params = new URLSearchParams({
    duration: 60, results: 100, remarks: 'false',
    suburban: String(stop.suburban), bus: String(!stop.suburban),
    subway: 'false', tram: 'false', ferry: 'false', express: 'false', regional: 'false',
  });
  // Nach 8 s abbrechen, damit eine hängende API das Dashboard nicht blockiert
  const res = await fetch(`${API}/stops/${stop.id}/departures?${params}`, { signal: AbortSignal.timeout(8000) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  lastGood[stop.id] = { departures: data.departures || [], at: new Date() };
}

// Letzte erfolgreiche Antwort je Station – wird weiter angezeigt, wenn die API mal ausfällt
const lastGood = {};

function reachable(stop, departures) {
  const now = Date.now();
  return departures
    .filter(d => {
      const targets = stop.lines[d.line?.name];
      return targets && targets.some(t => (d.direction || '').includes(t));
    })
    .map(d => {
      const when = new Date(d.when || d.plannedWhen);
      const minsAway = (when - now) / 60000;
      return {
        line: d.line.name,
        dest: cleanName(d.direction),
        when,
        delay: d.delay != null ? Math.round(d.delay / 60) : null,
        cancelled: !!d.cancelled,
        minsAway,
        leaveIn: minsAway - stop.walk,
        key: `${stop.id}|${d.tripId}|${d.line.name}|${d.plannedWhen}`,
        expiresAt: when.getTime() - stop.walk * 60000, // ab hier nicht mehr erreichbar
      };
    })
    // nur was ich noch erreiche
    .filter(d => d.leaveIn >= 0)
    .sort((a, b) => a.when - b.when)
    .slice(0, ROWS_PER_STOP);
}

function rowHtml(d) {
  const leave = Math.max(0, Math.floor(d.leaveIn));
  const go = !d.cancelled && d.leaveIn < 1.5;
  let delayTxt = '';
  if (d.cancelled) delayTxt = 'fällt aus';
  else if (d.delay > 0) delayTxt = `+${d.delay} min`;
  else if (d.delay === 0) delayTxt = 'pünktlich';
  // Animationsphase an die Uhr koppeln, damit das Neu-Rendern alle 5 s das Blinken nicht stört
  const leaveTxt = d.cancelled ? '' : go
    ? `<span class="go-label" style="animation-delay:-${Date.now() % 1600}ms">JETZT LOS!</span>`
    : `los in <b>${leave}</b> min`;
  return `
    <div class="row ${d.cancelled ? 'cancelled' : ''}" data-key="${d.key}" data-expires="${d.expiresAt}" data-kind="${d.line.startsWith('S') ? 's' : 'bus'}">
      <div class="badge ${d.line.startsWith('S') ? 's' : 'bus'}"${LINE_COLORS[d.line] ? ` style="--line-color:${LINE_COLORS[d.line]}"` : ''}>${d.line}</div>
      <div class="dest">${d.dest}<small>${fmtTime(d.when)}${delayTxt ? ' · ' + delayTxt : ''}</small></div>
      <div class="leave">${leaveTxt}</div>
      <div class="mins">${Math.max(0, Math.floor(d.minsAway))}<span> min</span></div>
    </div>`;
}

// ---------- Demo-Fahrplan ----------
// Springt ein, solange die API keine Daten liefert. Feste Takte, damit die Minuten sauber herunterzählen.
// [Linie, Ziel, Takt in min, Minute der ersten Abfahrt]
const DEMO_SCHEDULE = [
  ['S9',  'S Spandau Bhf',               20,  2],
  ['S9',  'S+U Warschauer Str.',         20, 12],
  ['S8',  'S Birkenwerder Bhf',          20,  5],
  ['S85', 'S Waidmannslust',             20, 15],
  ['S46', 'S Westend',                   10,  8],
  ['170', 'S+U Rathaus Steglitz',        10,  3],
  ['165', 'U Märkisches Museum',         20,  9],
  ['265', 'U Märkisches Museum',         10,  6],
];
function demoDepartures() {
  const now = Date.now(), out = [];
  const hourStart = new Date(); hourStart.setMinutes(0, 0, 0);
  for (const [line, direction, every, first] of DEMO_SCHEDULE) {
    for (let m = first - 60; m < 120; m += every) {
      const planned = hourStart.getTime() + m * 60000;
      if (planned < now - 5 * 60000) continue;
      // Pseudo-zufällige, aber gleichbleibende Verspätung je Fahrt (0–3 min), ab und zu ein Ausfall
      const seed = (planned / 60000 + line.length * 7 + first) % 13;
      const delay = seed < 7 ? 0 : seed < 11 ? 60 * (seed - 6) : 120;
      out.push({
        line: { name: line }, direction, tripId: `demo-${line}-${planned}`,
        plannedWhen: new Date(planned).toISOString(),
        when: new Date(planned + delay * 1000).toISOString(),
        delay, cancelled: seed === 12,
      });
    }
  }
  return out;
}

// ---------- Mini-Fahrzeuge ----------
// Fahrzeughöhe = Zeilenhöhe minus kleiner Rand (wird beim Losfahren gemessen)
// S-Bahn Baureihe 481: unten rot, oben gelb. Füllt die ganze Zeile, Führerstand vorne UND hinten.
function sbahnSvg(totalPx, heightPx) {
  const unit = heightPx / 30;                          // Zeichnung ist 30 Einheiten hoch
  const total = totalPx / unit, gap = 2;
  const n = Math.max(2, Math.round(total / 76));    // Anzahl Wagen
  const L = (total - gap * (n - 1)) / n;            // Wagenlänge
  const segs = [['w', .07, .15], ['d', .26, .09], ['w', .39, .09], ['w', .52, .09], ['d', .65, .09], ['w', .78, .15]];
  let cars = '';
  for (let i = 0; i < n; i++) {
    const x = i * (L + gap), first = i === 0, last = i === n - 1;
    // Wagenkasten mit runder Nase am jeweiligen Zugende
    const body = first
      ? `M${x + 10} 4 h${L - 10} v22 h-${L} v-13 q0 -9 10 -9 z`
      : last ? `M${x} 4 h${L - 10} q10 0 10 9 v13 h-${L} z` : `M${x} 4 h${L} v22 h-${L} z`;
    cars += `<path d="${body}" fill="#F2C200"/><rect x="${x}" y="17" width="${L}" height="9" fill="#C8102E"/>`;
    for (const [type, f, wf] of segs) {
      if (first && f < .1 || last && f > .75) continue;   // dort sitzt der Führerstand
      cars += type === 'd'
        ? `<rect x="${x + L * f}" y="7" width="${L * wf}" height="19" fill="#9a9a9a"/>`
        : `<rect x="${x + L * f}" y="8" width="${L * wf}" height="6" rx="1" fill="#2b2b2b"/>`;
    }
    if (first) cars += `<path d="M${x + 6} 8 q-4 1 -5 6 h7 v-6 z" fill="#2b2b2b"/>`;
    if (last) cars += `<path d="M${x + L - 6} 8 q4 1 5 6 h-7 v-6 z" fill="#2b2b2b"/>`;
    cars += `<circle cx="${x + L * .17}" cy="27" r="2.6" fill="#222"/><circle cx="${x + L * .83}" cy="27" r="2.6" fill="#222"/>`;
  }
  return `<svg viewBox="0 0 ${total} 30" aria-hidden="true"><line x1="0" y1="29" x2="${total}" y2="29" stroke="#777" stroke-width="1.5"/>${cars}</svg>`;
}
// BVG-Gelenkbus: gelb, dunkles Fensterband, Faltenbalg in der Mitte
const BUS_SVG = `<svg viewBox="0 0 140 30" aria-hidden="true">
    <rect x="12" y="1" width="16" height="3" rx="1" fill="#e8e8e8"/><rect x="90" y="1" width="20" height="3" rx="1" fill="#e8e8e8"/>
    <rect x="2" y="4" width="64" height="21" rx="3" fill="#F0D722"/>
    <rect x="72" y="4" width="66" height="21" rx="3" fill="#F0D722"/>
    <rect x="65" y="5" width="8" height="19" fill="#333"/>
    <path d="M67 5 v19 M69 5 v19 M71 5 v19" stroke="#666" stroke-width=".8"/>
    <rect x="5" y="7" width="58" height="9" rx="1" fill="#2b2b2b"/>
    <rect x="75" y="7" width="60" height="9" rx="1" fill="#2b2b2b"/>
    <path d="M134 7 h2 a2 2 0 0 1 2 2 v7 h-4 z" fill="#2b2b2b"/>
    ${[16, 52, 118].map(cx => `<circle cx="${cx}" cy="25" r="4.2" fill="#222"/><circle cx="${cx}" cy="25" r="1.6" fill="#999"/>`).join('')}
  </svg>`;

// Lässt das passende Fahrzeug durch die Zeile fahren und klappt sie danach zu
function driveAway(row) {
  return new Promise(resolve => {
    const rowW = row.clientWidth, isS = row.dataset.kind === 's';
    const vehH = row.clientHeight - 4; // so hoch wie die Zeile, damit die Nase die Schrift ganz überdeckt
    const vehW = isS ? rowW : Math.round(vehH * 140 / 30);
    const wiper = document.createElement('div');
    wiper.className = 'wiper';
    wiper.style.setProperty('--veh-w', `${vehW}px`);
    wiper.style.setProperty('--veh-h', `${vehH}px`);
    wiper.style.setProperty('--nose', `${Math.round(vehH / 30 * (isS ? 12 : 4))}px`); // Länge der Front
    wiper.style.setProperty('--row-w', `${rowW + vehW}px`);
    wiper.style.setProperty('--dur', isS ? '8s' : '6s');
    wiper.innerHTML = isS ? sbahnSvg(vehW, vehH) : BUS_SVG;
    row.appendChild(wiper);
    wiper.addEventListener('animationend', () => {
      row.style.maxHeight = `${row.offsetHeight}px`;
      void row.offsetHeight;
      row.classList.add('collapsing');
      setTimeout(resolve, 360);
    }, { once: true });
  });
}

// Abfragen (alle REFRESH_MS) und Anzeigen (jede Sekunde, aus den zuletzt geladenen Daten) sind getrennt,
// damit Zeilen sekundengenau verschwinden und die Minuten flüssig herunterzählen.
let fetching = false, lastResults = null;
async function refresh() {
  if (fetching) return; // keine überlappenden Anfragen
  fetching = true;
  lastResults = await Promise.allSettled(STOPS.map(loadStop));
  fetching = false;
  render();
}

let rendering = false;
async function render() {
  if (rendering) return; // läuft gerade eine Wegfahr-Animation, warten wir
  rendering = true;
  const status = document.getElementById('status');
  const html = STOPS.map((stop, i) => {
    const cached = lastGood[stop.id] || (DEMO && lastResults ? { departures: demoDepartures() } : null);
    const deps = cached ? reachable(stop, cached.departures) : null;
    const err = lastResults?.[i]?.reason;
    let body;
    if (!cached) body = `<div class="empty">${err ? `Keine Daten (${err.name === 'TimeoutError' ? 'API antwortet nicht' : err.message})` : 'Lade…'}</div>`;
    else if (!deps.length) body = `<div class="empty">Keine erreichbare Abfahrt in den nächsten 60 min</div>`;
    else body = deps.map(rowHtml).join('');
    return `<section>
      <div class="sec-head"><span class="title">${ICONS[stop.icon] || ''}${stop.label}</span><span class="walk">${stop.walk} min Fußweg</span></div>
      ${body}
    </section>`;
  }).join('');
  // Zeilen, die gerade unerreichbar geworden sind, erst wegfahren lassen
  const keep = new Set([...html.matchAll(/data-key="([^"]+)"/g)].map(m => m[1]));
  const gone = [...document.querySelectorAll('#sections .row[data-key]')]
    .filter(el => !keep.has(el.dataset.key) && Number(el.dataset.expires) <= Date.now() + 1000);
  if (gone.length && !reduceMotion) await Promise.all(gone.map(driveAway));
  document.getElementById('sections').innerHTML = html;
  rendering = false;

  if (!lastResults) return; // erste Abfrage läuft noch
  const failed = lastResults.filter(r => r.status === 'rejected').length;
  const stamps = Object.values(lastGood).map(c => c.at);
  const oldest = stamps.length ? new Date(Math.min(...stamps)) : null;
  status.className = failed ? 'error' : '';
  const light = document.getElementById('api-light');
  light.setAttribute('class', `door-btn ${failed ? 'err' : 'ok'}`);
  light.setAttribute('aria-label', failed ? 'API antwortet nicht' : 'API ok');
  const demoInUse = DEMO && STOPS.some(st => !lastGood[st.id]);
  status.innerHTML = `<span>${failed ? 'API antwortet nicht' + (demoInUse ? ' – DEMO-Fahrplan' : oldest ? ' – zeige letzte bekannte Daten' : '') : 'Live-Daten VBB'}</span>`;
}

// ---------- Klappuhr ----------
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const flips = {};
document.querySelectorAll('#flipclock .flip').forEach(el => {
  el.innerHTML = ['top', 'bottom', 'flap-top', 'flap-bottom'].map(c => `<div class="${c}"><span></span></div>`).join('');
  const part = c => el.querySelector(`.${c} span`);
  flips[el.dataset.key] = { el, top: part('top'), bottom: part('bottom'), flapTop: part('flap-top'), flapBottom: part('flap-bottom'), value: null };
  // Nach der Animation steht der neue Wert auch unten fest
  el.querySelector('.flap-bottom').addEventListener('animationend', () => {
    flips[el.dataset.key].bottom.textContent = flips[el.dataset.key].value;
    el.classList.remove('flipping');
  });
});

function setFlip(key, value) {
  const f = flips[key];
  if (f.value === value) return;
  const old = f.value;
  f.value = value;
  if (old === null || reduceMotion) {
    f.top.textContent = f.bottom.textContent = value;
    return;
  }
  // Oben schon neu, unten noch alt – die Klappe fällt dazwischen
  f.top.textContent = value;
  f.bottom.textContent = old;
  f.flapTop.textContent = old;
  f.flapBottom.textContent = value;
  f.el.classList.remove('flipping');
  void f.el.offsetWidth; // Animation neu starten
  f.el.classList.add('flipping');
}

function tickClock() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('date-wd').textContent = now.toLocaleDateString('de-DE', { weekday: 'long' });
  document.getElementById('date-dm').textContent = now.toLocaleDateString('de-DE', { day: 'numeric', month: 'long' });
  setFlip('h1', hh[0]); setFlip('h2', hh[1]);
  setFlip('m1', mm[0]); setFlip('m2', mm[1]);
  const ss = String(now.getSeconds()).padStart(2, '0');
  setFlip('s1', ss[0]); setFlip('s2', ss[1]);
}

// Darkmode-Kippschalter: ohne gespeicherte Wahl folgt das Dashboard dem System
const toggle = document.getElementById('theme-toggle');
const systemDark = window.matchMedia('(prefers-color-scheme: dark)');
let theme = null;
try { theme = localStorage.getItem('theme'); } catch (e) {}
if (theme !== 'light' && theme !== 'dark') theme = null;
function applyTheme() {
  if (theme) document.documentElement.setAttribute('data-theme', theme);
  else document.documentElement.removeAttribute('data-theme');
  const mode = theme || (systemDark.matches ? 'dark' : 'light');
  toggle.dataset.mode = mode;
  toggle.title = mode === 'dark' ? 'Dunkel – klicken für Hell' : 'Hell – klicken für Dunkel';
}
applyTheme();
systemDark.addEventListener('change', applyTheme);
toggle.addEventListener('click', () => {
  theme = toggle.dataset.mode === 'dark' ? 'light' : 'dark';
  applyTheme();
  try { localStorage.setItem('theme', theme); } catch (e) {}
});

// LED-Kranz des Türknopfs: 32 kleine Striche im Kreis
document.querySelector('#api-light .leds').innerHTML = Array.from({ length: 32 }, (_, i) => {
  const a = i / 32 * Math.PI * 2, c = Math.cos(a), sn = Math.sin(a);
  return `<line x1="${50 + c * 28.5}" y1="${50 + sn * 28.5}" x2="${50 + c * 35.5}" y2="${50 + sn * 35.5}"/>`;
}).join('');

// ---------- LED-Laufschrift ----------
// Ablauf: Spruch läuft LED_PASSES-mal durch, dann steht der Stationsname LED_STATIC_SEC Sekunden still – und von vorn.
const LED_TEXT = 'WER ZU SPÄT KOMMT MAHLT ZUERST';
const LED_STATION = '◀ BAUMSCHULENWEG'; // ◀ = Ausstieg links
const LED_PASSES = 5, LED_STATIC_SEC = 12, LED_SPEED = 20; // Spalten pro Sekunde

const LED_FONT = { // 5x7-Pixelschrift, eine Zeile pro Pixelreihe
  A: ['01110','10001','10001','11111','10001','10001','10001'],
  Ä: ['01010','00000','01110','10001','11111','10001','10001'],
  B: ['11110','10001','10001','11110','10001','10001','11110'],
  C: ['01110','10001','10000','10000','10000','10001','01110'],
  D: ['11100','10010','10001','10001','10001','10010','11100'],
  E: ['11111','10000','10000','11110','10000','10000','11111'],
  G: ['01110','10001','10000','10111','10001','10001','01111'],
  H: ['10001','10001','10001','11111','10001','10001','10001'],
  I: ['01110','00100','00100','00100','00100','00100','01110'],
  K: ['10001','10010','10100','11000','10100','10010','10001'],
  L: ['10000','10000','10000','10000','10000','10000','11111'],
  M: ['10001','11011','10101','10101','10001','10001','10001'],
  N: ['10001','11001','10101','10011','10001','10001','10001'],
  O: ['01110','10001','10001','10001','10001','10001','01110'],
  P: ['11110','10001','10001','11110','10000','10000','10000'],
  R: ['11110','10001','10001','11110','10100','10010','10001'],
  S: ['01111','10000','10000','01110','00001','00001','11110'],
  T: ['11111','00100','00100','00100','00100','00100','00100'],
  U: ['10001','10001','10001','10001','10001','10001','01110'],
  W: ['10001','10001','10001','10101','10101','10101','01010'],
  Z: ['11111','00001','00010','00100','01000','10000','11111'],
  '◀': ['0001','0011','0111','1111','0111','0011','0001'],
  ' ': ['000','000','000','000','000','000','000'],
};
// Text in Pixelspalten umwandeln (je Spalte 7 Bits)
function textToCols(text) {
  const cols = [];
  for (const ch of text) {
    const g = LED_FONT[ch] || LED_FONT[' '];
    for (let x = 0; x < g[0].length; x++) cols.push(g.map(row => row[x] === '1'));
    cols.push(Array(7).fill(false)); // Abstand zwischen Buchstaben
  }
  cols.pop();
  return cols;
}
const scrollCols = textToCols(LED_TEXT);
const stationCols = textToCols(LED_STATION);

const led = document.getElementById('led');
const ledCtx = led.getContext('2d');
let ledStart = null;
function drawLed(t) {
  if (ledStart === null) ledStart = t;
  const dpr = window.devicePixelRatio || 1;
  const w = led.clientWidth, h = led.clientHeight;
  if (led.width !== Math.round(w * dpr)) { led.width = Math.round(w * dpr); led.height = Math.round(h * dpr); }
  ledCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ledCtx.clearRect(0, 0, w, h);

  // Punktraster so fein wählen, dass der Stationsname komplett hineinpasst
  const pitch = Math.min(h / 9, w / (stationCols.length + 4));
  const rows = Math.floor(h / pitch), cols = Math.floor(w / pitch);
  const xOff = (w - cols * pitch) / 2, yOff = (h - rows * pitch) / 2;
  const top = Math.floor((rows - 7) / 2);
  const r = pitch * 0.36;

  // Wo im Ablauf sind wir gerade?
  const passCols = cols + scrollCols.length;             // Text kommt rechts rein und läuft links ganz raus
  const scrollSec = LED_PASSES * passCols / LED_SPEED;
  const cycle = (t - ledStart) / 1000 % (scrollSec + LED_STATIC_SEC);
  let colAt;
  if (cycle < scrollSec) {
    const shift = Math.floor(cycle * LED_SPEED) % passCols;
    colAt = c => scrollCols[c - cols + shift];
    led.setAttribute('aria-label', LED_TEXT);
  } else {
    const left = Math.floor((cols - stationCols.length) / 2);
    colAt = c => stationCols[c - left];
    led.setAttribute('aria-label', 'Baumschulenweg, Ausstieg links');
  }

  for (let c = 0; c < cols; c++) {
    const col = colAt(c);
    for (let rr = 0; rr < rows; rr++) {
      const on = col && rr >= top && rr < top + 7 && col[rr - top];
      ledCtx.beginPath();
      ledCtx.arc(xOff + c * pitch + pitch / 2, yOff + rr * pitch + pitch / 2, r, 0, Math.PI * 2);
      if (on) { ledCtx.fillStyle = '#FFB31A'; ledCtx.shadowColor = '#FF9900'; ledCtx.shadowBlur = pitch * 0.9; }
      else { ledCtx.fillStyle = '#2a2012'; ledCtx.shadowBlur = 0; }
      ledCtx.fill();
    }
  }
  ledCtx.shadowBlur = 0;
  requestAnimationFrame(drawLed);
}
requestAnimationFrame(drawLed);

// Genau zum Sekundenwechsel umklappen statt irgendwann innerhalb der Sekunde
function scheduleClock() {
  tickClock();
  setTimeout(scheduleClock, 1000 - (Date.now() % 1000) + 5);
}
scheduleClock();
render(); setInterval(render, 1000);
refresh(); setInterval(refresh, REFRESH_MS);
</script>
